<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="effects">
        <canvas id="warpCanvas"></canvas>
        <canvas id="gridCanvas"></canvas>
        <canvas id="fireworksCanvas"></canvas>
    </div>
    <button id="fillAllBtn" class="btn"
        style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000;">Fill All Boxes</button>

    <div class="container">
        <h1>ASCII Art Generator</h1>

        <form action="/ascii-art" method="POST" class="form">
            <div class="form-group">
                <label for="text">Enter your text:</label>
                <textarea id="text" name="text" placeholder="Type your message here..." required></textarea>
            </div>

            <div class="form-group">
                <label>Choose banner style:</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="banner" value="standard" checked>
                        <span>Standard</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="banner" value="shadow">
                        <span>Shadow</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="banner" value="thinkertoy">
                        <span>Thinkertoy</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Choose background effect:</label>
                <div class="radio-group centered">
                    <label class="radio-option">
                        <input type="radio" name="effect" value="warp" checked>
                        <span>Warp</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="effect" value="fireworks">
                        <span>Fireworks</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn">Generate ASCII Art</button>
        </form>

        {{if .Result}}
        <div class="result-info">
            <h2>Result:</h2>
            <pre>{{.Result}}</pre>
        </div>
        {{end}}
    </div>

    <script src="/static/page.js"></script>
</body>

</html>
